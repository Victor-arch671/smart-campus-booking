<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Smart Campus Booking</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-container">
    <h2>Register</h2>
    <form id="registerForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email" required>

      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Password" required>
        <span id="togglePassword" class="toggle-icon">Show</span>
      </div>

      <input type="text" id="department" placeholder="Department (optional)">

      <!-- Security question, used later for the Forgot Password flow -->
      <select id="securityQuestion" required>
        <option value="" disabled selected>-- Choose a security question --</option>
        <option value="What was the name of your first school?">What was the name of your first school?</option>
        <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
        <option value="What was the name of your childhood pet?">What was the name of your childhood pet?</option>
        <option value="What city were you born in?">What city were you born in?</option>
      </select>
      <input type="text" id="securityAnswer" placeholder="Your answer" required>

      <button type="submit">Register</button>
    </form>
    <p id="errorMsg" class="error"></p>
    <p id="successMsg" class="success"></p>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script src="js/api/authApi.js"></script>
  <script src="js/utils/auth.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
