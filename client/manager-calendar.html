<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar - Smart Campus Booking</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body">
  <div class="dashboard-wrapper">

    <div class="dashboard-header">
      <h2>Calendar</h2>
      <nav>
        <a href="manager-dashboard.html">← Back to Dashboard</a>
        <a href="manager-approvals.html">Pending Approvals</a>
        <a href="manager-utilization.html">Utilization</a>
      </nav>
      <button id="logoutBtn">Logout</button>
    </div>

    <!-- Facility picker: choose which of your facilities to view the calendar for -->
    <div class="plate-header">
      <span class="plate-kicker">Step 1</span>
      <h3>Select a Facility</h3>
    </div>
    <select id="facilitySelect">
      <option value="">-- Choose a facility --</option>
    </select>
    <p id="pageMsg"></p>

    <!-- Calendar results appear here once a facility is selected -->
    <div class="table-scroll">
      <table id="calendarTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Purpose</th>
          </tr>
        </thead>
        <tbody id="calendarTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/utils/auth.js?v=3"></script>
  <script src="js/api/facilityApi.js?v=3"></script>
  <script src="js/api/managerApi.js?v=3"></script>
  <script src="js/pages/manager-calendar.js?v=3"></script>
</body>
</html>
