<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - Smart Campus Booking</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-container">
    <h2>Forgot Password</h2>

    <!-- Step 1: enter email to retrieve the security question -->
    <form id="emailForm">
      <input type="email" id="email" placeholder="Your account email" required>
      <button type="submit">Continue</button>
    </form>
    <p id="emailMsg" class="error"></p>

    <!-- Step 2: shown only after the security question is successfully retrieved -->
    <form id="resetForm" style="display: none;">
      <p id="questionText" style="font-weight: 600; font-size: 0.9rem;"></p>
      <input type="text" id="securityAnswer" placeholder="Your answer" required>

      <div class="password-wrapper">
        <input type="password" id="newPassword" placeholder="New password" required>
        <span id="togglePassword" class="toggle-icon">Show</span>
      </div>

      <button type="submit">Reset Password</button>
    </form>
    <p id="resetMsg" class="error"></p>
    <p id="resetSuccessMsg" class="success"></p>

    <p><a href="login.html">Back to Login</a></p>
  </div>

  <script src="js/api/authApi.js"></script>
  <script src="js/pages/forgot-password.js"></script>
</body>
</html>
