<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Risk Alerts - Smart Campus Booking</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body">
  <div class="dashboard-wrapper">

    <div class="dashboard-header">
      <h2>Risk Alerts</h2>
      <nav>
        <a href="admin-dashboard.html">← Back to Dashboard</a>
        <a href="admin-users.html">Users</a>
        <a href="admin-bookings.html">All Bookings</a>
        <a href="admin-facilities.html">Facilities</a>
        <a href="admin-maintenance.html">Maintenance</a>
        <a href="admin-reports.html">Reports</a>
      </nav>
      <button id="logoutBtn">Logout</button>
    </div>

    <div class="plate-header">
      <span class="plate-kicker">Filter</span>
      <h3>Alert Status</h3>
    </div>
    <select id="statusFilter">
      <option value="">All Alerts</option>
      <option value="open" selected>Open</option>
      <option value="reviewed">Reviewed</option>
      <option value="dismissed">Dismissed</option>
    </select>

    <div class="table-scroll">
      <table id="riskTable">
        <thead>
          <tr>
            <th>Type</th>
            <th>User</th>
            <th>Description</th>
            <th>Flagged At</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="riskTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/utils/auth.js"></script>
  <script src="js/api/riskApi.js"></script>
  <script src="js/pages/admin-risk-alerts.js"></script>
</body>
</html>
